services:
  postgres:
    image: postgres:17-alpine
    container_name: dukaan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dukaan
      POSTGRES_PASSWORD: dukaan
      POSTGRES_DB: dukaan
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - dukaan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukaan -d dukaan"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  dukaan-pgdata:
